
<!DOCTYPE html>
<html lang="en" data-theme="hacktoberfest25">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | dwar</title>
  
  
    
    
  
  
  <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body class="min-h-screen bg-base-100 text-base-content">
  <main class="min-h-screen w-full">
    
  <div class="transition-stage min-h-screen w-full bg-[#0a0204] flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-[3600ms] ease-[cubic-bezier(0.16,1,0.3,1)] select-none">
    
    <!-- Rich Dark Red + Black Vignette Background -->
    <div class="vignette-background absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,#360913_0%,#180308_45%,#050102_90%)]"></div>
    
    <!-- Mouse-Following Spotlight Glow -->
    <div class="door-spotlight absolute w-[650px] h-[650px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[radial-gradient(circle,rgba(212,175,55,0.18)_0%,rgba(169,26,44,0.35)_35%,rgba(112,23,35,0.1)_65%,transparent_80%)] blur-3xl pointer-events-none transition-transform duration-100 ease-out"></div>
    
    <!-- Vignette Edge Overlay -->
    <div class="vignette-overlay absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,transparent_35%,rgba(0,0,0,0.88)_100%)]"></div>

    <!-- Zoom Overlay for Door Opening Transition -->
    <div class="zoom-overlay absolute inset-0 z-20 pointer-events-none opacity-0 transition-all duration-[2200ms] ease-[cubic-bezier(0.16,1,0.3,1)]"></div>

    <!-- Studio Circular Logo -->
    <img class="absolute top-8 left-8 w-28 h-auto z-10 filter drop-shadow-[0_6px_20px_rgba(0,0,0,0.85)]" src="assets/door-animation/CIRCULAR_LOGO.png" alt="Logo" />

    <!-- Centerpiece Door Showcase -->
    <div class="relative group flex flex-col items-center z-10">
      
      <!-- Golden Arch Surround Frame -->
      <div class="door-arch-frame relative p-[3px] rounded-[103px_103px_0_0] bg-gradient-to-b from-[#d4af37]/60 via-[#8a7224]/30 to-[#3a0b12]/10 shadow-[0_0_30px_rgba(212,175,55,0.25),0_20px_50px_rgba(0,0,0,0.85)] transition-all duration-500 group-hover:shadow-[0_0_45px_rgba(212,175,55,0.5),0_25px_60px_rgba(0,0,0,0.95)] group-hover:from-[#d4af37]/90">
        
        <!-- Original Door Link Anchor -->
        <a class="door-link relative block w-[200px] h-[300px] rounded-[100px_100px_0_0] bg-[#0f0003] overflow-hidden no-underline transition-all duration-[2200ms] ease-[cubic-bezier(0.16,1,0.3,1)] cursor-pointer group/door" href="dwar/" aria-label="Open dwar">
          
          <!-- Warm Gold Threshold Glow (Revealed on hover / door open) -->
          <div class="portal-gold-glow absolute inset-0 rounded-[100px_100px_0_0] bg-[radial-gradient(circle_at_center,#fff5e6_0%,#ffd700_30%,#a91a2c_70%,#3a0b12_100%)] flex items-center justify-center opacity-0 group-hover/door:opacity-50 transition-opacity duration-500 pointer-events-none"></div>

          <!-- Original Door Panel -->
          <div class="door absolute inset-0 rounded-[100px_100px_0_0] bg-[#a91a2c] shadow-[inset_-20px_7px_#701723] box-border origin-left transition-all duration-[2200ms] ease-[cubic-bezier(0.16,1,0.3,1)] cursor-pointer">
            
            <!-- Metallic Gold Door Handle Accent -->
            <div class="door-handle absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-1 group-hover/door:scale-110 transition-transform duration-300 pointer-events-none z-10">
              <div class="w-3 h-10 rounded-full bg-gradient-to-r from-[#f3e0aa] via-[#d4af37] to-[#aa8024] shadow-[2px_3px_10px_rgba(0,0,0,0.8)] border border-[#fff2d1]/60"></div>
              <div class="w-2 h-2 rounded-full bg-[#f3e0aa] shadow-sm"></div>
            </div>

          </div>
        </a>
      </div>

      <!-- Floating "Click to Enter" Caption -->
      <div class="door-caption mt-8 flex flex-col items-center gap-2 pointer-events-none transition-all duration-300">
        <span class="text-xs uppercase tracking-[0.45em] font-semibold text-[#f3e0aa] drop-shadow-[0_0_12px_rgba(212,175,55,0.6)] animate-pulse">Click to Enter</span>
        <div class="w-1.5 h-4 rounded-full bg-gradient-to-b from-[#d4af37] to-transparent animate-bounce"></div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const element = document.querySelector('.door');
      const link = document.querySelector('.door-link');
      const spotlight = document.querySelector('.door-spotlight');

      // Mouse-Following Spotlight Logic
      if (spotlight) {
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetX = mouseX;
        let targetY = mouseY;

        window.addEventListener('pointermove', (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
        });

        function animateSpotlight() {
          mouseX += (targetX - mouseX) * 0.07;
          mouseY += (targetY - mouseY) * 0.07;
          spotlight.style.left = `${mouseX}px`;
          spotlight.style.top = `${mouseY}px`;
          requestAnimationFrame(animateSpotlight);
        }
        animateSpotlight();
      }

      if (!element || !link) return;

      element.addEventListener('click', () => {
        element.classList.add('doorOpen');
      });

      link.addEventListener('click', (event) => {
        event.preventDefault();
        const overlay = document.querySelector('.zoom-overlay');
        const stage = document.querySelector('.transition-stage');
        const rect = link.getBoundingClientRect();

        // Immediately hide caption, gold arch frame, gold handle, & spotlight upon clicking
        document.querySelectorAll('.door-caption, .door-handle, .portal-gold-glow, .door-spotlight').forEach(el => {
          el.classList.add('is-hidden-on-open');
        });
        const archFrame = document.querySelector('.door-arch-frame');
        if (archFrame) archFrame.classList.add('is-frame-hidden-on-open');

        element.classList.add('doorOpen');
        link.classList.add('doorExpand');
        element.classList.add('doorPanelExpand');
        stage.classList.add('is-revealing');

        if (overlay && stage) {
          overlay.classList.add('is-revealing');
          const stageRect = stage.getBoundingClientRect();
          overlay.style.transform = `translate(${rect.left - stageRect.left}px, ${rect.top - stageRect.top}px) scale(24)`;
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
        }

        setTimeout(() => {
          document.body.classList.add('is-fading-out');
        }, 2800);

        setTimeout(() => {
          window.location.href = 'dwar/';
        }, 3600);
      });
    });
  </script>

  <style>
    body.is-fading-out {
      opacity: 0;
      transition: opacity 500ms ease-out;
    }

    .is-hidden-on-open {
      opacity: 0 !important;
      visibility: hidden !important;
      transition: opacity 250ms ease-out, visibility 250ms ease-out !important;
    }

    .is-frame-hidden-on-open {
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
      border: none !important;
      transition: all 250ms ease-out !important;
    }

    .doorOpen {
      transform: perspective(1200px) translateZ(0px) translateX(0px) translateY(0px) rotateY(-112deg) scale(1.02);
    }

    .doorExpand {
      transform: scale(3.35) translateY(-34px);
      box-shadow: 0 0 0 9999px #0f0003;
    }

    .doorPanelExpand {
      transform: rotateY(-112deg) scale(3.35) translateY(-34px);
    }

    .transition-stage.is-revealing {
      background-color: #0f0003;
      transition: background-color 3600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .transition-stage.is-revealing .door-caption,
    .transition-stage.is-revealing .door-handle,
    .transition-stage.is-revealing .portal-gold-glow,
    .transition-stage.is-revealing .door-spotlight {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    .transition-stage.is-revealing .door-arch-frame {
      background: transparent !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .transition-stage {
      background-color: #0a0204;
    }

    .zoom-overlay {
      transform-origin: top left;
      border-radius: 9999px;
      clip-path: circle(0% at center);
      opacity: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(244,240,235,0.78) 45%, rgba(232,226,218,0.7) 100%);
      transition: transform 3600ms cubic-bezier(0.16, 1, 0.3, 1), opacity 3600ms ease-out;
    }

    .zoom-overlay.is-revealing {
      opacity: 0.96;
      clip-path: circle(180% at center);
      background: radial-gradient(circle at center, rgba(21, 1, 4, 0.94) 0%, rgba(21, 1, 4, 0.84) 45%, rgba(21, 1, 4, 0.72) 100%);
    }
  </style>

  </main>
</body>

</html>
