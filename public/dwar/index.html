<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dwar</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7f7f7 0%, #ececec 100%);
        font-family: Inter, Arial, sans-serif;
        color: #111;
      }
      .card {
        width: min(92vw, 640px);
        padding: 48px;
        border-radius: 28px;
        background: white;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2.2rem;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #444;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 999px;
        background: #701723;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to dwar</h1>
      <p>This is a dedicated page for the door transition, separate from the landing experience.</p>
      <a href="/">Back to landing</a>
    </main>
  </body>
</html>
